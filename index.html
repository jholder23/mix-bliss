<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#1a1410" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Glop a tube of wet paint onto a blank tray, then fold it with a finger, knife, or stick."
    />
    <title>Impasto — wet paint mixer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="canvas" aria-label="Wet paint canvas"></canvas>

    <div id="fail" class="fail" hidden>
      <p>This mixer needs WebGL2, which this browser does not provide. Try a current mobile Safari, Chrome, or Firefox.</p>
    </div>

    <p id="hint" class="hint">Pick a color. Tap to dump that color. Other tools only mix.</p>

    <aside class="tray" aria-label="Paint controls">
      <header class="brand">
        <div>
          <h1>Impasto</h1>
          <p id="tube-name">Cadmium Red ready to glop.</p>
        </div>
      </header>

      <div class="swatches" role="listbox" aria-label="Paint colors" id="swatches"></div>

      <div class="tools" role="toolbar" aria-label="Mixing tools">
        <button id="tool-glop" class="tool on" type="button" aria-pressed="true">Glop</button>
        <button id="tool-finger" class="tool" type="button" aria-pressed="false">Finger</button>
        <button id="tool-knife" class="tool" type="button" aria-pressed="false">Knife</button>
        <button id="tool-stick" class="tool" type="button" aria-pressed="false">Stick</button>
      </div>

      <label class="slider">
        <span class="slider-meta">
          <span>Size</span>
          <strong id="size-label">Medium</strong>
        </span>
        <input id="size" type="range" min="18" max="100" value="52" />
      </label>

      <label class="slider">
        <span class="slider-meta">
          <span>Viscosity</span>
          <strong id="visc-label">Honey</strong>
        </span>
        <input id="viscosity" type="range" min="0" max="100" value="72" />
        <span class="ticks" aria-hidden="true">
          <span>Water</span>
          <span>Cream</span>
          <span>Honey</span>
          <span>Tar</span>
        </span>
      </label>

      <div class="actions">
        <button id="scrape" type="button">Scrape</button>
        <button id="sound" class="toggle" type="button" aria-pressed="false">Sound</button>
      </div>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
