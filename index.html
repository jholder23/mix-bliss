<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#6b5e50" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Top-down oil paint on a tray. Glop a still bead, then fold it with a palette knife."
    />
    <title>Impasto — oil on a tray</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="canvas" aria-label="Paint tray, viewed from above"></canvas>

    <div id="fail" class="fail" hidden>
      <p>This mixer needs WebGL2 with floating-point textures, which this browser or GPU does not provide. Try a current Chrome, Firefox, or Safari.</p>
    </div>

    <p id="hint" class="hint">Pick a tube and glop a still bead. Switch to Scraper and drag to fold. The knife never dumps color.</p>

    <aside class="tray" aria-label="Paint controls">
      <header class="brand">
        <div>
          <h1>Impasto</h1>
          <p id="tube-name">Cadmium Red ready to glop.</p>
        </div>
      </header>

      <div class="swatches" role="listbox" aria-label="Paint colors" id="swatches"></div>

      <div class="tools" role="toolbar" aria-label="Mixing tools">
        <button id="tool-glop" class="tool on" type="button" aria-pressed="true">Glop</button>
        <button id="tool-scraper" class="tool" type="button" aria-pressed="false">Scraper</button>
      </div>

      <label class="slider">
        <span class="slider-meta">
          <span>Size</span>
          <strong id="size-label">Bead</strong>
        </span>
        <input id="size" type="range" min="18" max="100" value="52" />
      </label>

      <label class="slider">
        <span class="slider-meta">
          <span>Viscosity</span>
          <strong id="visc-label">Impasto</strong>
        </span>
        <input id="viscosity" type="range" min="0" max="100" value="76" />
        <span class="ticks" aria-hidden="true">
          <span>Soft oil</span>
          <span>Heavy</span>
          <span>Impasto</span>
          <span>Tar</span>
        </span>
      </label>

      <div class="actions">
        <button id="blank" type="button">Blank tray</button>
      </div>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
