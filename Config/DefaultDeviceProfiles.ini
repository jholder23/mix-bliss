; Impasto phone profiles. Desktop PIE keeps DefaultEngine Lumen.
; Packaged Android / iOS inherit these: no Lumen, deferred mobile, dielectric oil stays.

[Android DeviceProfile]
DeviceType=Android
+CVars=r.DynamicGlobalIlluminationMethod=0
+CVars=r.ReflectionMethod=3
+CVars=r.Shadow.Virtual.Enable=0
+CVars=r.Lumen.DiffuseIndirect.Allow=0
+CVars=r.Lumen.Reflections.Allow=0
+CVars=r.PathTracing=0
+CVars=r.SkyLight.RealTimeReflectionCapture=0
+CVars=r.Mobile.ShadingPath=1
+CVars=r.MobileHDR=1
+CVars=r.Mobile.AntiAliasing=1
+CVars=r.AntiAliasingMethod=1
+CVars=r.MobileMSAA=4
+CVars=r.BloomQuality=3
+CVars=r.DefaultFeature.MotionBlur=0
+CVars=r.Tonemapper.Quality=3
+CVars=r.ShadowQuality=3
+CVars=r.MobileContentScaleFactor=1.0
+CVars=r.Mobile.PixelProjectedReflection=1

[Android_Vulkan DeviceProfile]
+CVars=r.Mobile.ShadingPath=1
+CVars=r.MobileMSAA=4
+CVars=r.MobileHDR=1
+CVars=r.DynamicGlobalIlluminationMethod=0
+CVars=r.Lumen.DiffuseIndirect.Allow=0
+CVars=r.PathTracing=0

[Android_High DeviceProfile]
+CVars=r.Mobile.ShadingPath=1
+CVars=r.MobileMSAA=4
+CVars=r.ScreenPercentage=100
+CVars=r.BloomQuality=4
+CVars=r.ShadowQuality=4
+CVars=r.MobileContentScaleFactor=1.0

[Android_Mid DeviceProfile]
+CVars=r.Mobile.ShadingPath=1
+CVars=r.MobileMSAA=2
