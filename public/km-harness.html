<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Impasto KM harness</title>
  </head>
  <body>
    <p>Kubelka–Munk mix harness (no WebGL).</p>
    <script type="module">
      import { mixTubePaints, masstoneSrgb, tubeByName, customTube } from '/src/paints.ts'
      import { srgbHueChroma } from '/src/km.ts'

      function resolve(name) {
        return tubeByName(name) ?? customTube(name)
      }

      window.__km = {
        ready: true,
        mix(a, b, amountA = 1, amountB = 1) {
          const rgb = mixTubePaints(resolve(a), resolve(b), amountA, amountB)
          const hc = srgbHueChroma(rgb)
          return { rgb, hue: hc.h, chroma: hc.c, lightness: hc.l }
        },
        masstone(name) {
          return masstoneSrgb(resolve(name))
        },
      }
    </script>
  </body>
</html>
